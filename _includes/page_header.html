<div id="header-and-nav">
    <div id="title">
        <title>Thomas O'Dea</title>
    </div>
    <div id="navigation">
        {% for item in site.data.navigation %}
            <div class="nav-item">
                {% if page.url==item.link %}
                    {{item.name}}
                {% else %}
                    <a href="{{ item.link }}">{{ item.name }}</a>
                {% endif %}
            </div>
        {% endfor %}
    </div>
</div>
