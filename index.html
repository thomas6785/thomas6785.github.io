---
title: Index
---

<!DOCTYPE html>

<html>
    <head>
        {% include html_head_boilerplate.html %}
        <link rel="stylesheet" href="/css/index.css">
    </head>
    <body>
        {% include page_header.html %}

            <div id="quick-links">
                <h1>Quick Links</h1>
                <img class="link-favicon" src="https://www.linkedin.com/favicon.ico" alt=""><a href="https://www.linkedin.com/in/thomas-odea-dublin/">View my LinkedIn</a><br/>
                <img class="link-favicon" src="https://github.githubassets.com/favicons/favicon.svg" alt=""><a href="https://www.github.com/thomas6785">View my GitHub</a><br/>
            </div>

            <div id="updates-list">
                <h1>Recent Posts</h1>
                <div id="index-updates">

                <ul>
                    {% for post in site.posts %}
                    {% if post.tags contains "hide-from-index" %}{% else %}
                        <li><a href="{{ post.url }}">{{ post.title }}</a><br></li>
                    {% endif %}
                    {% endfor %}
                </ul>

                </div>
            </div>
        </div>
    </body>
</html>
